name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Run unit tests
        run: swift test

      - name: Build release binaries
        run: |
          swift build -c release --product RouteWeaver
          swift build -c release --product RouteWeaverTunHelper
